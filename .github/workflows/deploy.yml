name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: PigHouseFE/package-lock.json

      - name: Install dependencies
        working-directory: PigHouseFE
        run: npm ci

      - name: Build
        working-directory: PigHouseFE
        run: npx ng build --base-href /PigHouse/

      - name: Copy index.html to 404.html
        run: cp PigHouseFE/dist/PigHouseFE/browser/index.html PigHouseFE/dist/PigHouseFE/browser/404.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: PigHouseFE/dist/PigHouseFE/browser
