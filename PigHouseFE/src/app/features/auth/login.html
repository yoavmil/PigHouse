<div class="hero">
  <div class="hero-content">

    <div class="title-section">
      <span class="pig-emoji">🐷</span>
      <h1 class="app-title">בית של חזירים</h1>
      <p class="app-subtitle">ניהול משימות הבית לכל המשפחה</p>
    </div>

    <mat-card class="login-card">
      <mat-card-content>

        <p class="card-heading">כניסה למערכת</p>

        <form [formGroup]="form" (ngSubmit)="login()">

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>שם המשפחה</mat-label>
            <input matInput formControlName="familyName" placeholder="כהן" autocomplete="organization">
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>שם פרטי</mat-label>
            <input matInput formControlName="userName" placeholder="ישראל" autocomplete="name">
          </mat-form-field>

          @if (error()) {
            <p class="error-msg">{{ error() }}</p>
          }

          <button
            mat-flat-button
            type="submit"
            class="full-width action-btn"
            [disabled]="form.invalid || loading()"
          >
            {{ loading() ? 'כניסה...' : 'כניסה' }}
          </button>

        </form>

        <div class="divider-row">
          <mat-divider />
          <span class="divider-text">או</span>
          <mat-divider />
        </div>

        <button mat-stroked-button class="full-width" (click)="createFamily()">
          משפחה חדשה
        </button>

      </mat-card-content>
    </mat-card>

  </div>
</div>
